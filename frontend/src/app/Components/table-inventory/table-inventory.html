
<h2>Listado de inventario</h2>

<table mat-table
       [dataSource]="daticos"
       class="mat-elevation-z8">

  <!-- ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">
      {{ element.id }}
    </td>
  </ng-container>

  <!-- PRODUCTO ID -->
  <ng-container matColumnDef="producto_id">
    <th mat-header-cell *matHeaderCellDef>ID Producto</th>
    <td mat-cell *matCellDef="let element">
      {{ element.producto_id }}
    </td>
  </ng-container>

  <!-- PRODUCTO -->
  <ng-container matColumnDef="producto">
    <th mat-header-cell *matHeaderCellDef>Producto</th>
    <td mat-cell *matCellDef="let element">
      {{ element.producto }}
    </td>
  </ng-container>

  <!-- CANTIDAD -->
  <ng-container matColumnDef="cantidad">
    <th mat-header-cell *matHeaderCellDef>Cantidad</th>
    <td mat-cell *matCellDef="let element">
      {{ element.cantidad }}
    </td>
  </ng-container>

  <!-- UBICACION -->
  <ng-container matColumnDef="ubicacion">
    <th mat-header-cell *matHeaderCellDef>Ubicación</th>
    <td mat-cell *matCellDef="let element">
      {{ element.ubicacion }}
    </td>
  </ng-container>

  <!-- FECHA ACTUALIZACION -->
  <ng-container matColumnDef="fecha_actualizacion">
    <th mat-header-cell *matHeaderCellDef>Última actualización</th>
    <td mat-cell *matCellDef="let element">
      {{ element.fecha_actualizacion | date:'dd/MM/yyyy HH:mm' }}
    </td>
  </ng-container>

  <tr mat-header-row
      *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row
      *matRowDef="let row; columns: displayedColumns"></tr>

</table>
