
<mat-sidenav-container class="sidenav-container">

  <!-- MENÚ LATERAL -->
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false">

    <!-- LOGO -->
    <mat-toolbar class="logo">

      <mat-icon fontSet="material-symbols-outlined">
        two_wheeler
      </mat-icon>

      <span>Tienda de Motos</span>

    </mat-toolbar>

    <!-- SECCIÓN ADMINISTRACIÓN -->
    <p class="menu-title">ADMINISTRACIÓN</p>

    <mat-nav-list>

      <!-- CLIENTES -->
      <a
        mat-list-item
        href="/clientes"
        [class.active]="rutaActual === '/clientes'">

        <mat-icon matListItemIcon
                  fontSet="material-symbols-outlined">
          groups
        </mat-icon>

        <span matListItemTitle>Clientes</span>

      </a>

      <!-- PRODUCTOS -->
      <a
        mat-list-item
        href="/productos"
        [class.active]="rutaActual === '/productos'">

        <mat-icon matListItemIcon
                  fontSet="material-symbols-outlined">
          inventory_2
        </mat-icon>

        <span matListItemTitle>Productos</span>

      </a>

      <!-- VENTAS -->
      <a
        mat-list-item
        href="/ventas"
        [class.active]="rutaActual === '/ventas'">

        <mat-icon matListItemIcon
                  fontSet="material-symbols-outlined">
          shopping_cart
        </mat-icon>

        <span matListItemTitle>Ventas</span>

      </a>

      <!-- INVENTARIO -->
      <a
        mat-list-item
        href="/inventario"
        [class.active]="rutaActual === '/inventario'">

        <mat-icon matListItemIcon
                  fontSet="material-symbols-outlined">
          warehouse
        </mat-icon>

        <span matListItemTitle>Inventario</span>

      </a>

    </mat-nav-list>

    <!-- SECCIÓN CUENTA -->
    <p class="menu-title">CUENTA</p>

    <mat-nav-list>

      <!-- LOGIN -->
      <a
        mat-list-item
        href="/login"
        [class.active]="rutaActual === '/login'">

        <mat-icon matListItemIcon
                  fontSet="material-symbols-outlined">
          login
        </mat-icon>

        <span matListItemTitle>Iniciar sesión</span>

      </a>

    </mat-nav-list>

  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content>

    <!-- BARRA SUPERIOR -->
    <mat-toolbar class="toolbar">

      @if (isHandset$ | async) {

        <button
          type="button"
          matIconButton
          aria-label="Abrir menú"
          (click)="drawer.toggle()">

          <mat-icon fontSet="material-symbols-outlined">
            menu
          </mat-icon>

        </button>

      }

      <span>Panel de administración</span>

    </mat-toolbar>

    <!-- CONTENIDO DE CADA VISTA -->
    <main class="contenido">

      <router-outlet></router-outlet>

    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
